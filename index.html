<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dutch Verbs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="netherlands.png">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4">

    <!-- Header -->
    <header class="text-center py-2">
        <h1 class="text-2xl font-bold text-indigo-400">🇳🇱 Dutch Verbs</h1>
        <p id="stats" class="text-xs text-slate-400 mt-2">Φόρτωση δεδομένων...</p>
    </header>

    <!-- Flashcard Container -->
    <main class="flex-1 flex flex-col items-center justify-center max-w-lg mx-auto w-full my-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full shadow-xl text-center flex flex-col justify-between">
            <div id="card-front">
                <span class="text-xs uppercase tracking-wider text-indigo-300 font-semibold">Ρήμα (Infinitive)</span>
                <h2 id="verb-target" class="text-4xl font-extrabold mt-3">-</h2>
            </div>
            
            <div id="card-back" class="hidden mt-4 pt-4 border-t border-slate-700 text-left space-y-3">
                <!-- Μετάφραση (Κεντραρισμένη, χωρίς ταμπέλα) -->
                <div class="text-center py-1">
                    <p id="verb-translation" class="text-2xl text-emerald-400 font-semibold">-</p>
                </div>

                <!-- O.V.T.1 -->
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 flex justify-between items-center">
                    <span class="text-xs font-semibold text-amber-300 uppercase">O.V.T.</span>
                    <p id="verb-ovt1" class="text-sm font-mono text-slate-200">-</p>
                </div>

                <!-- O.V.T.2 -->
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 flex justify-between items-center">
                    <span class="text-xs font-semibold text-amber-300 uppercase">O.V.T.</span>
                    <p id="verb-ovt2" class="text-sm font-mono text-slate-200">-</p>
                </div>

                <!-- V.T.T. -->
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50 flex justify-between items-center">
                    <span class="text-xs font-semibold text-indigo-300 uppercase">V.T.T.</span>
                    <p id="verb-vtt" class="text-sm font-mono text-slate-200">-</p>
                </div>
            </div>
        </div>

        <!-- Action Area -->
        <div id="action-area" class="w-full mt-6">
            <button onclick="revealCard()" id="btn-show" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 px-6 rounded-xl transition shadow-lg">
                Εμφάνιση Απάντησης
            </button>

            <!-- Choice Buttons -->
            <div id="choice-buttons" class="hidden grid grid-cols-2 gap-3 w-full">
                <button onclick="handleChoice('again')" class="bg-rose-600 hover:bg-rose-500 py-3 rounded-xl font-bold text-sm transition shadow-lg">
                    🔄 Ξανά (Πιο συχνά)
                </button>
                <button onclick="handleChoice('next')" class="bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold text-sm transition shadow-lg">
                    ✔️ Επόμενο (Λιγότερο)
                </button>
            </div>
        </div>
    </main>

    <!-- Φόρτωση των δεδομένων από το verbs.js που παράγει η Python -->
    <script src="verbs.js"></script>

    <script>
        let verbs = [];
        let currentVerbIndex = null;

        function initApp() {
            try {
                // Χρησιμοποιεί απευθείας τη μεταβλητή verbsData από το verbs.js
                verbs = verbsData.map(v => ({ ...v, weight: v.weight || 1 }));
            } catch (err) {
                console.error("Σφάλμα φόρτωσης verbs.js:", err);
                verbs = [
                    { id: "1", infinitive: "zijn", translation: "είμαι", ovt: "was / <b>waren</b>", vtt: "geweest", weight: 1 }
                ];
            }

            const saved = localStorage.getItem('smart_verbs_srs_v5');
            if (saved) {
                try { 
                    const savedVerbs = JSON.parse(saved);
                    verbs = verbs.map(v => {
                        const found = savedVerbs.find(s => s.id === v.id);
                        return found ? { ...v, weight: found.weight } : v;
                    });
                } catch(e) {}
            }
            loadNextCard();
        }

        function getWeightedRandomCard(verbsArray) {
            // Τα πρώτα 100 ρήματα παίρνουν τριπλάσιο βάρος (3x πιθανότητα εμφάνισης)
            const weights = verbsArray.map((_, index) => (index < 100 ? 3 : 1));
            const totalWeight = weights.reduce((sum, w) => sum + w, 0);
            
            let randomNum = Math.random() * totalWeight;
            for (let i = 0; i < verbsArray.length; i++) {
                if (randomNum < weights[i]) {
                    return verbsArray[i];
                }
                randomNum -= weights[i];
            }
            return verbsArray[0];
        }
        
        function getWeightedRandomIndex() {
            let totalWeight = verbs.reduce((sum, v) => sum + v.weight, 0);
            let randomNum = Math.random() * totalWeight;
            
            for (let i = 0; i < verbs.length; i++) {
                if (randomNum < verbs[i].weight) {
                    return i;
                }
                randomNum -= verbs[i].weight;
            }
            return 0;
        }

        function loadNextCard() {
            if (verbs.length === 0) return;
            currentVerbIndex = getWeightedRandomIndex();
            const current = getWeightedRandomCard(verbs);

            document.getElementById('verb-target').innerText = current.infinitive;
            document.getElementById('verb-translation').innerText = current.translation;
            document.getElementById('verb-ovt1').innerText = current.ovt1;
            document.getElementById('verb-ovt2').innerText = current.ovt2;
            document.getElementById('verb-vtt').innerHTML = current.vtt;

            let learningCount = verbs.filter(v => v.weight > 1).length;
            document.getElementById('stats').innerText = `Σύνολο: ${verbs.length} | Σε επανάληψη (Ξανά): ${learningCount}`;

            document.getElementById('card-back').classList.add('hidden');
            document.getElementById('btn-show').classList.remove('hidden');
            document.getElementById('choice-buttons').classList.add('hidden');
        }

        function revealCard() {
            document.getElementById('card-back').classList.remove('hidden');
            document.getElementById('btn-show').classList.add('hidden');
            document.getElementById('choice-buttons').classList.remove('hidden');
        }

        function handleChoice(choice) {
            let current = verbs[currentVerbIndex];

            if (choice === 'again') {
                current.weight += 2;
            } else {
                current.weight = Math.max(1, current.weight - 1);
            }

            localStorage.setItem('smart_verbs_srs_v5', JSON.stringify(verbs));
            loadNextCard();
        }

        initApp();
    </script>
</body>
</html>
