<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dutch Verbs Smart SRS</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-4">

    <!-- Header -->
    <header class="text-center py-2">
        <h1 class="text-2xl font-bold text-indigo-400">🇳🇱 Dutch Verbs Smart SRS</h1>
        <p id="stats" class="text-xs text-slate-400 mt-2">Φόρτωση...</p>
    </header>

    <!-- Flashcard Container -->
    <main class="flex-1 flex flex-col items-center justify-center max-w-lg mx-auto w-full my-4">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl p-6 w-full shadow-xl text-center flex flex-col justify-between">
            <div id="card-front">
                <span class="text-xs uppercase tracking-wider text-indigo-300 font-semibold">Ρήμα (Infinitive)</span>
                <h2 id="verb-target" class="text-4xl font-extrabold mt-3">-</h2>
            </div>
            
            <div id="card-back" class="hidden mt-4 pt-4 border-t border-slate-700 text-left space-y-3">
                <!-- Μετάφραση (Κεντραρισμένη, χωρίς ταμπέλα) -->
                <div class="text-center py-1">
                    <p id="verb-translation" class="text-2xl text-emerald-400 font-semibold">-</p>
                </div>

                <!-- O.V.T. (Αόριστος ανά πρόσωπο) -->
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50">
                    <span class="text-xs font-semibold text-amber-300 uppercase block mb-1">Onvoltooid Verleden Tijd (O.V.T.)</span>
                    <p id="verb-ovt" class="text-sm font-mono text-slate-200 leading-relaxed">-</p>
                </div>

                <!-- Voltooid Tegenwoordige Tijd (Παρακείμενος) -->
                <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-700/50">
                    <span class="text-xs font-semibold text-indigo-300 uppercase block mb-1">Voltooid Tegenwoordige Tijd (O.T.T.)</span>
                    <p id="verb-ott" class="text-sm font-mono text-slate-200 leading-relaxed">-</p>
                </div>
            </div>
        </div>

        <!-- Action Area -->
        <div id="action-area" class="w-full mt-6">
            <button onclick="revealCard()" id="btn-show" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 px-6 rounded-xl transition shadow-lg">
                Εμφάνιση Απάντησης
            </button>

            <!-- Choice Buttons (Επόμενο / Ξανά) -->
            <div id="choice-buttons" class="hidden grid grid-cols-2 gap-3 w-full">
                <button onclick="handleChoice('again')" class="bg-rose-600 hover:bg-rose-500 py-3 rounded-xl font-bold text-sm transition shadow-lg">
                    🔄 Ξανά (Πιο συχνά)
                </button>
                <button onclick="handleChoice('next')" class="bg-emerald-600 hover:bg-emerald-500 py-3 rounded-xl font-bold text-sm transition shadow-lg">
                    ✔️ Επόμενο (Λιγότερο)
                </button>
            </div>
        </div>
    </main>

    <!-- Script Λογική -->
    <script>
        // Χρησιμοποιούμε HTML tags (<b>) μέσα στα strings για να γίνονται bold μόνο τα ρήματα
        let verbs = [
            { 
                id: "1", 
                infinitive: "zijn", 
                translation: "είμαι", 
                ovt: "ik <b>was</b>, jij/u/hij/zij/het <b>was</b>, we/jullie/ze <b>waren</b>", 
                ott: "ik <b>ben geweest</b>, jij/u/hij/zij/het <b>is geweest</b>, we/jullie/ze <b>zijn geweest</b>", 
                weight: 1 
            },
            { 
                id: "2", 
                infinitive: "hebben", 
                translation: "έχω", 
                ovt: "ik <b>had</b>, jij/u/hij/zij/het <b>had</b>, we/jullie/ze <b>hadden</b>", 
                ott: "ik <b>heb gehad</b>, jij/u/hij/zij/het <b>heeft gehad</b>, we/jullie/ze <b>hebben gehad</b>", 
                weight: 1 
            },
            { 
                id: "3", 
                infinitive: "gaan", 
                translation: "πηγαίνω", 
                ovt: "ik <b>ging</b>, jij/u/hij/zij/het <b>ging</b>, we/jullie/ze <b>gingen</b>", 
                ott: "ik <b>ben gegaan</b>, jij/u/hij/zij/het <b>is gegaan</b>, we/jullie/ze <b>zijn gegaan</b>", 
                weight: 1 
            },
            { 
                id: "4", 
                infinitive: "komen", 
                translation: "έρχομαι", 
                ovt: "ik <b>kwam</b>, jij/u/hij/zij/het <b>kwam</b>, we/jullie/ze <b>kwamen</b>", 
                ott: "ik <b>ben gekomen</b>, jij/u/hij/zij/het <b>is gekomen</b>, we/jullie/ze <b>zijn gekomen</b>", 
                weight: 1 
            },
            { 
                id: "5", 
                infinitive: "doen", 
                translation: "κάνω", 
                ovt: "ik <b>deed</b>, jij/u/hij/zij/het <b>deed</b>, we/jullie/ze <b>deden</b>", 
                ott: "ik <b>heb gedaan</b>, jij/u/hij/zij/het <b>heeft gedaan</b>, we/jullie/ze <b>hebben gedaan</b>", 
                weight: 1 
            },
            { 
                id: "6", 
                infinitive: "zien", 
                translation: "βλέπω", 
                ovt: "ik <b>zag</b>, jij/u/hij/zij/het <b>zag</b>, we/jullie/ze <b>zagen</b>", 
                ott: "ik <b>heb gezien</b>, jij/u/hij/zij/het <b>heeft gezien</b>, we/jullie/ze <b>hebben gezien</b>", 
                weight: 1 
            },
            { 
                id: "7", 
                infinitive: "spreken", 
                translation: "μιλάω", 
                ovt: "ik <b>sprak</b>, jij/u/hij/zij/het <b>sprak</b>, we/jullie/ze <b>spraken</b>", 
                ott: "ik <b>heb gesproken</b>, jij/u/hij/zij/het <b>heeft gesproken</b>, we/jullie/ze <b>hebben gesproken</b>", 
                weight: 1 
            },
            { 
                id: "8", 
                infinitive: "zeggen", 
                translation: "λέω", 
                ovt: "ik <b>zei</b>, jij/u/hij/zij/het <b>zei</b>, we/jullie/ze <b>zeiden</b>", 
                ott: "ik <b>heb gezegd</b>, jij/u/hij/zij/het <b>heeft gezegd</b>, we/jullie/ze <b>hebben gezegd</b>", 
                weight: 1 
            },
            { 
                id: "9", 
                infinitive: "weten", 
                translation: "ξέρω", 
                ovt: "ik <b>wist</b>, jij/u/hij/zij/het <b>wist</b>, we/jullie/ze <b>wisten</b>", 
                ott: "ik <b>heb geweten</b>, jij/u/hij/zij/het <b>heeft geweten</b>, we/jullie/ze <b>hebben geweten</b>", 
                weight: 1 
            },
            { 
                id: "10", 
                infinitive: "willen", 
                translation: "θέλω", 
                ovt: "ik <b>wilde</b>, jij/u/hij/zij/het <b>wilde</b>, we/jullie/ze <b>wilden</b>", 
                ott: "ik <b>heb gewild</b>, jij/u/hij/zij/het <b>heeft gewild</b>, we/jullie/ze <b>hebben gewild</b>", 
                weight: 1 
            },
            { 
                id: "11", 
                infinitive: "kunnen", 
                translation: "μπορώ", 
                ovt: "ik <b>kon</b>, jij/u/hij/zij/het <b>kon</b>, we/jullie/ze <b>konden</b>", 
                ott: "ik <b>heb gekund</b>, jij/u/hij/zij/het <b>heeft gekund</b>, we/jullie/ze <b>hebben gekund</b>", 
                weight: 1 
            },
            { 
                id: "12", 
                infinitive: "moeten", 
                translation: "πρέπει", 
                ovt: "ik <b>moest</b>, jij/u/hij/zij/het <b>moest</b>, we/jullie/ze <b>moesten</b>", 
                ott: "ik <b>heb gemoeten</b>, jij/u/hij/zij/het <b>heeft gemoeten</b>, we/jullie/ze <b>hebben gemoeten</b>", 
                weight: 1 
            }
        ];

        let currentVerbIndex = null;

        function initApp() {
            const saved = localStorage.getItem('smart_verbs_srs_v3');
            if (saved) {
                try { verbs = JSON.parse(saved); } catch(e) {}
            }
            loadNextCard();
        }

        function getWeightedRandomIndex() {
            let totalWeight = verbs.reduce((sum, v) => sum + v.weight, 0);
            let randomNum = Math.random() * totalWeight;
            
            for (let i = 0; i < verbs.length; i++) {
                if (randomNum < verbs[i].weight) {
                    return i;
                }
                randomNum -= verbs[i].weight;
            }
            return 0;
        }

        function loadNextCard() {
            currentVerbIndex = getWeightedRandomIndex();
            const current = verbs[currentVerbIndex];

            // Ενημέρωση UI (Χρησιμοποιούμε innerHTML αντί για innerText στα ρήματα για να διαβάζει τα <b> tags)
            document.getElementById('verb-target').innerText = current.infinitive;
            document.getElementById('verb-translation').innerText = current.translation;
            document.getElementById('verb-ovt').innerHTML = current.ovt;
            document.getElementById('verb-ott').innerHTML = current.ott;

            let learningCount = verbs.filter(v => v.weight > 1).length;
            document.getElementById('stats').innerText = `Σύνολο: ${verbs.length} | Σε επανάληψη (Ξανά): ${learningCount}`;

            document.getElementById('card-back').classList.add('hidden');
            document.getElementById('btn-show').classList.remove('hidden');
            document.getElementById('choice-buttons').classList.add('hidden');
        }

        function revealCard() {
            document.getElementById('card-back').classList.remove('hidden');
            document.getElementById('btn-show').classList.add('hidden');
            document.getElementById('choice-buttons').classList.remove('hidden');
        }

        function handleChoice(choice) {
            let current = verbs[currentVerbIndex];

            if (choice === 'again') {
                current.weight += 2;
            } else {
                current.weight = Math.max(1, current.weight - 1);
            }

            localStorage.setItem('smart_verbs_srs_v3', JSON.stringify(verbs));
            loadNextCard();
        }

        initApp();
    </script>
</body>
</html>
